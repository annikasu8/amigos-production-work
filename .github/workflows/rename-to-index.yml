name: Rename uploaded file to index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          git config user.name "annikasu8"
          git config user.email "annikasu8@users.noreply.github.com"
          git mv amigos-production-work.html index.html
          git commit -m "Rename amigos-production-work.html to index.html"
          git push
